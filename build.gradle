plugins {
    id 'java'
    id 'application'
}

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def lwjglVersion = '3.3.4'
def osName = System.getProperty('os.name').toLowerCase()
def lwjglNatives = osName.contains('win') ? 'natives-windows' :
    osName.contains('mac') ? (System.getProperty('os.arch').contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos') : 'natives-linux'

dependencies {
    // controle (gamepad) ligado ao PC, lido por reflexao: opcional (sem estes JARs so funciona o teclado)
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:$lwjglNatives"
    // JARs REAIS do Pedro Pathing e do SDK (se houver) devem ficar em libs/real: entram antes dos stubs no classpath
    runtimeOnly fileTree(dir: 'libs/real', include: ['*.jar'])
    // API do FTC SDK 12.0, Pedro Pathing 2.1.2 e FTC Dashboard 0.6.0 gerada do dex do projeto da equipe (somente assinaturas)
    implementation files('libs/ftc-stubs.jar')
}

application {
    mainClass = 'biobuzz.Viewer'
}

tasks.register('selfTest', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'biobuzz.SelfTest'
}

tasks.register('sdkTest', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'biobuzz.sdk.SdkSelfTest'
    // para rodar o TeleOp original: ./gradlew sdkTest -Pteamcode=<TeamCode/src/main/java>
    if (project.hasProperty('teamcode')) systemProperty 'biobuzz.teamcode', project.property('teamcode')
}
